<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ammar's Birthday</title>

<style>
@font-face {
    font-family: 'custom';
    src: url('liftablack.otf');
}

body {
    margin: 0;
    background: white;
    font-family: 'custom';
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    direction: rtl; /* ✅ الإضافة الوحيدة */
}

.container {
    border: 1px solid black;
    border-radius: 25px;
    background: #f5f5f5;
    padding: 40px 30px;
    width: 90%;
    max-width: 320px;
    box-sizing: border-box;
}

.title {
    text-align: center;
    margin-bottom: 20px;
    font-size: 18px;
}

input {
    width: 100%;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid black;
    outline: none;
    text-align: center;
    font-family: 'custom';
    margin-bottom: 15px;
    box-sizing: border-box; /* ✅ ده اللي اتضاف بس */
}

.lock {
    text-align: center;
    font-size: 24px;
    color: gray;
    margin-bottom: 15px;
}

button {
    width: 100%;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid black;
    background: white;
    cursor: pointer;
    font-family: 'custom';
}
</style>
</head>

<body>

<div class="container">
    <div class="title" id="title">ادخل كلمة المرور</div>

    <input type="text" id="password" placeholder="هنا">

    <div class="lock" id="lock">🔒</div>

    <button onclick="checkPassword()">يلا بينااااا</button>
</div>

<script>
function checkPassword() {
    let input = document.getElementById("password");
    let title = document.getElementById("title");
    let lock = document.getElementById("lock");

    if (input.value === "بحبك") {
        title.innerText = "بحبك فشخ ي عمور❤️ ..";
        lock.innerText = "🔓";

        setTimeout(function(){
            window.location.href = "page2.html";
        }, 2000);

    } else {
        title.innerText = "شكلك مش بتحبني😔";
        input.value = "";
        input.placeholder = "حاول مرة أخرى";
    }
}
</script>

</body>
</html>
